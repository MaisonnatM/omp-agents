# omp settings that the starter kit applies with `omp config set`, one setting at a time.
# Keys you already set keep their value unless you pass --force. Every other key in your
# config.yml stays as it is.

# Primary model per role. Anthropic first; see AGENTS.md for the provider order.
modelRoles:
  default: anthropic/claude-opus-5-5:high
  slow: anthropic/claude-opus-5-5:high
  plan: anthropic/claude-opus-5-5:high
  advisor: anthropic/claude-sonnet-5-5:medium
  vision: anthropic/claude-sonnet-5-5:medium
  smol: anthropic/claude-haiku-4-5
  commit: anthropic/claude-haiku-4-5
  tiny: anthropic/claude-haiku-4-5
  task: anthropic/claude-sonnet-5-5:high

retry:
  # Skip a provider whose plan reports no quota left; a plain API key stays eligible.
  usageAwareFallback: true
  usageReservePct: 0
  usageReservePolicy: auto
  # Per role: OpenAI Codex, then Cursor, then OpenRouter (open-weight models only).
  fallbackChains:
    default:
      - openai-codex/gpt-6-sol:high
      - cursor/grok-4.7-high
      - openrouter/deepseek/deepseek-v4.1-flash:high
    slow:
      - openai-codex/gpt-6-astra:xhigh
      - cursor/grok-4.7-xhigh
      - openrouter/moonshotai/kimi-k3:high
    plan:
      - openai-codex/gpt-6-sol:high
      - cursor/grok-4.7-high
      - openrouter/z-ai/glm-5.3:high
    advisor:
      - openai-codex/gpt-5.6-terra:medium
      - cursor/grok-4.7-medium
      - openrouter/z-ai/glm-5.3:low
    vision:
      - openai-codex/gpt-5.6-terra
      - cursor/grok-4.7-medium
      - openrouter/z-ai/glm-5.3-flash:low
    smol:
      - openai-codex/gpt-6-luna
      - cursor/composer-2.5-fast
      - openrouter/minimax/minimax-m3
    commit:
      - openai-codex/gpt-6-luna
      - cursor/composer-2.5-fast
      - openrouter/deepseek/deepseek-v4.1-flash:high
    tiny:
      - openai-codex/gpt-6-luna
      - cursor/composer-2.5-fast
      - openrouter/minimax/minimax-m3
    task:
      - openai-codex/gpt-6-sol:high
      - cursor/grok-4.7-high
      - openrouter/moonshotai/kimi-k3:high

modelProviderOrder:
  - anthropic
  - openai-codex
  - cursor
  - openrouter

# Subagents work in their own worktree; successful changes apply back as a patch.
task:
  isolation:
    enabled: true
    merge: patch
  eager: default
  maxConcurrency: 2

# Publish every terminal session to the local Collab registry, so the omp-agents dashboard can drive it.
collab:
  autoStart: control
