# omp settings that the starter kit applies with `omp config set`, one setting at a time.
# Keys you already set keep their value unless you pass --force. Every other key in your
# config.yml stays as it is.

# Primary model per role. Anthropic first; see ~/.omp/agent/docs/model-routing.md.
modelRoles:
  default: anthropic/claude-opus-5-5:auto
  slow: anthropic/claude-opus-5-5:high
  plan: anthropic/claude-fable-5-1:medium
  thermo_review: anthropic/claude-fable-5-1:medium
  advisor: anthropic/claude-sonnet-5-5:medium
  vision: anthropic/claude-sonnet-5-5:medium
  smol: anthropic/claude-haiku-5-5
  commit: anthropic/claude-haiku-5-5
  tiny: anthropic/claude-haiku-5-5
  judge: anthropic/claude-haiku-5-5
  task: anthropic/claude-opus-5-5:auto

retry:
  # Skip a provider whose plan reports no quota left; a plain API key stays eligible.
  usageAwareFallback: true
  usageReservePct: 0
  usageReservePolicy: auto
  # Codex first; cheap roles may use Cursor Composer.
  fallbackChains:
    default:
      - openai-codex/gpt-6.1-sol
    slow:
      - openai-codex/gpt-6-astra:xhigh
    plan:
      - openai-codex/gpt-6.1-sol
    advisor:
      - openai-codex/gpt-6.1-terra:medium
    vision:
      - openai-codex/gpt-6.1-terra
    smol:
      - openai-codex/gpt-6-luna
      - cursor/composer-2.5-fast
    commit:
      - openai-codex/gpt-6-luna
      - cursor/composer-2.5-fast
    tiny:
      - openai-codex/gpt-6-luna
      - cursor/composer-2.5-fast
    judge:
      - openai-codex/gpt-6-luna
    task:
      - openai-codex/gpt-6.1-sol

modelProviderOrder:
  - anthropic
  - openai-codex
  - cursor

# `isolated: true` subagents work in their own clone of the checkout their `checkout` option names; successful changes apply back there as a patch.
task:
  isolation:
    enabled: true
    merge: patch
  eager: default
  maxConcurrency: 2

# Publish every terminal session to the local Collab registry, so the omp-agents dashboard can drive it.
collab:
  autoStart: control
