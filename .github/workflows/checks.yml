name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # The server and most tests import omp's own modules from its installed package.
      - run: bun install -g @oh-my-pi/pi-coding-agent@18.4.10
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      # The desktop shell is its own package; Electron downloads its binary only on first launch, so this installs no app.
      - run: bun install --cwd desktop --frozen-lockfile
      - run: bun run --cwd desktop typecheck
