name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # Every change that reaches main adds CHANGELOG.md lines (CODING_STANDARDS.md#changelog); a PR merged on GitHub skips the local hooks.
      - if: github.event_name == 'pull_request'
        run: git diff --quiet "${{ github.event.pull_request.base.sha }}" HEAD -- CHANGELOG.md && { echo "::error::Add lines to CHANGELOG.md, as CODING_STANDARDS.md#changelog says."; exit 1; } || true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # The server and most tests import omp's own modules from its installed package, which needs no install script.
      - run: bun install -g --ignore-scripts @oh-my-pi/pi-coding-agent@18.18.8
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      # The desktop shell is its own package; Electron downloads its binary only on first launch, so this installs no app.
      - run: bun install --cwd desktop --frozen-lockfile
      - run: bun run --cwd desktop typecheck
