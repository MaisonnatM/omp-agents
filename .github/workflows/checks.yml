name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # The server and most tests import omp's own modules from its installed package, which needs no install script.
      - run: bun install -g --ignore-scripts @oh-my-pi/pi-coding-agent@18.12.6
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      # The desktop shell is its own package; Electron downloads its binary only on first launch, so this installs no app.
      - run: bun install --cwd desktop --frozen-lockfile
      - run: bun run --cwd desktop typecheck
