name: Release

# Every push to main publishes the macOS app to GitHub Releases, which the installed apps' updater reads through
# `latest-mac.yml`. The version is desktop/package.json's major.minor with the run number as its patch, so it always
# grows without a commit back to main; bump major.minor there by hand.
#
# Each job holds only what it needs. The tests, which run the most third-party code, see no secret and only a read
# token. The build sees the signing secrets in its signing step alone and a read token. Only the publish job can write
# to the repository, and it runs no code from the checkout or its dependencies. Actions are pinned to commits, since a
# moved tag would otherwise run new code beside the signing secrets.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A burst of merges releases only the last one.
concurrency:
  group: release
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # The tests import omp's own modules from its installed package, which needs no install script.
      - run: bun install -g --ignore-scripts @oh-my-pi/pi-coding-agent@18.12.6
      - run: bun install --frozen-lockfile
      - run: bun install --cwd desktop --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: bun run --cwd desktop typecheck

  build:
    needs: test
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun install --cwd desktop --frozen-lockfile
      - name: Set the version from the run number
        id: version
        run: |
          version=$(bun -e '
            const path = "./desktop/package.json";
            const pkg = require(path);
            const [major, minor] = pkg.version.split(".");
            pkg.version = `${major}.${minor}.${process.env.GITHUB_RUN_NUMBER}`;
            require("fs").writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
            console.log(pkg.version);
          ')
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      # Signing and notarization run when the Apple secrets are set; without them the app is signed ad hoc, which
      # opens only after the user allows it in System Settings and which the updater cannot replace.
      - name: Build and sign the app
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$APPLE_API_KEY_CONTENT" ]; then
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY"
          fi
          [ -n "$CSC_LINK" ] || unset CSC_LINK CSC_KEY_PASSWORD
          bun scripts/build-desktop-artifact.ts --arch arm64,x64
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          if-no-files-found: error
          retention-days: 1
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
            desktop/release/latest-mac.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          cd release
          gh release create "$TAG" --target "$GITHUB_SHA" --title "omp agents ${TAG#v}" --generate-notes \
            *.dmg *.zip *.blockmap latest-mac.yml
