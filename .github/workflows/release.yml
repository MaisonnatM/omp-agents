name: Release

# Push a `vX.Y.Z` tag whose version matches desktop/package.json to publish the macOS app to GitHub Releases, which the
# installed apps' updater reads through `latest-mac.yml`.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # The tests import omp's own modules from its installed package.
      - run: bun install -g @oh-my-pi/pi-coding-agent@18.10.1
      - run: bun install --frozen-lockfile
      - run: bun install --cwd desktop --frozen-lockfile
      - name: Check the tag names desktop/package.json's version
        run: |
          version=$(bun -e 'console.log(require("./desktop/package.json").version)')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match desktop/package.json's version $version." >&2
            exit 1
          fi
      - run: bun test
      - run: bun run typecheck
      - run: bun run --cwd desktop typecheck
      # Signing and notarization run when the Apple secrets are set; without them the app is signed ad hoc, which
      # opens only after the user allows it in System Settings and which the updater cannot replace.
      - name: Build the app
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$APPLE_API_KEY_CONTENT" ]; then
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY"
          fi
          [ -n "$CSC_LINK" ] || unset CSC_LINK CSC_KEY_PASSWORD
          bun scripts/build-desktop-artifact.ts --arch arm64,x64
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd desktop/release
          gh release create "$GITHUB_REF_NAME" --title "omp agents ${GITHUB_REF_NAME#v}" --generate-notes \
            *.dmg *.zip *.blockmap latest-mac.yml
